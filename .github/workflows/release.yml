name: release

# Runs when a version tag such as v0.1.0 is pushed. It builds every system, tests first, and leaves a draft release for
# the maintainer to read and publish by hand.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -timeout 120s -count=1 ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="japan-emergency-alerts_${GITHUB_REF_NAME}_${os}_${arch}"
            binary=alerts
            if [ "$os" = windows ]; then binary=alerts.exe; fi
            mkdir "dist/$name"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/$name/$binary" ./cmd/alerts
            cp README.md LICENSE NOTICE.md "dist/$name/"
            (cd dist && zip -qr "$name.zip" "$name")
            rm -r "dist/$name"
          done
          (cd dist && sha256sum ./*.zip > SHA256SUMS)

      # A draft, so nothing reaches the public until the maintainer has looked at it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS
