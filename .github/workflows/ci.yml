name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -timeout 120s -count=1 ./...

      # Most users run the binary on a Windows PC, so a build that only works on Linux must fail here.
      - name: Build for Windows
        env:
          GOOS: windows
        run: go build ./...

      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
